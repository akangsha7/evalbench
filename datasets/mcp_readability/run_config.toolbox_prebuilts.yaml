############################################################
### MCP Readability — MCP Toolbox prebuilt tool sets (daily)
############################################################
# Scores every prebuilt tool set shipped by googleapis/mcp-toolbox against the
# style guide, one endpoint per prebuilt, and appends the results to BigQuery so
# regressions in a tool's description or schema surface within a day.
#
# `endpoints_config` below is generated, not checked in. Run the refresh first:
#
#   python datasets/mcp_readability/refresh_toolbox_prebuilts.py --version 1.8.0
#   EVAL_GCP_PROJECT_ID=<project> EVAL_GCP_PROJECT_REGION=global \
#     uv run python evalbench/evalbench.py \
#     --experiment_config datasets/mcp_readability/run_config.toolbox_prebuilts.yaml

orchestrator: mcp_readability

scorers:
  # Deterministic size metrics. Pass = within token budget.
  mcp_tool_metrics:
    token_budget: 200000
  # LLM judge vs the style guide. Pass = no P0 findings. Needs
  # EVAL_GCP_PROJECT_ID and EVAL_GCP_PROJECT_REGION=global.
  mcp_style_readability:
    model_config: datasets/model_configs/gemini_3.1_pro_model.yaml
    style_guide: datasets/mcp_readability/style_guide.md

# Regenerated by refresh_toolbox_prebuilts.py, so coverage tracks upstream as
# prebuilts are added or removed.
endpoints_config: datasets/mcp_readability/endpoints.toolbox_prebuilts.yaml
exceptions_config: datasets/mcp_readability/exceptions.yaml
tools_generator_config: datasets/mcp_readability/tools_generator.yaml

endpoint_types: []

# Every endpoint reads a captured file, so this bounds judge calls in flight,
# not connections to any server.
runners:
  endpoint_runners: 4

reporting:
  csv:
    output_directory: 'results'
  # Appends to <gcp_project_id>.evalbench.results and .scores; the
  # mcp_readability_* columns self-provision on the first run.
  # bigquery:
  #   gcp_project_id: your-gcp-project
