# Sample MCP endpoints. Each entry has: product_name, implementation
# (toolbox | one_mcp), endpoint_type (PROD | AUTOPUSH | STAGING | DEV), and a
# pluggable tools_source.
#
# Endpoints that share a `product_name` are treated as alternative
# *implementations* of that product and compared side by side (Toolbox vs
# one-MCP): each is scored against the union of capabilities exposed by any
# implementation of the product (union-based completeness). `implementation`
# labels which one it is in the comparison report.
#
# An endpoint's identity for reporting is (product_name, implementation). The
# source is defined entirely by tools_source — there is no top-level endpoint_url.
# tools_source.type selects how tools are obtained (independent of endpoint_type,
# which is just the deployment channel / reporting metadata):
#   http  - live tools/list over Streamable HTTP; url is the endpoint address
#   stdio - launch a local MCP server and speak MCP over its stdio pipes
#   file  - read a raw tools/list JSON dump (offline / deterministic)

endpoints:
  # --- Cloud SQL: one-MCP endpoint vs MCP Toolbox ---------------------------
  - product_name: "Cloud SQL"
    implementation: one_mcp
    endpoint_type: PROD
    tools_source:
      type: http
      url: "https://sqladmin.googleapis.com/mcp"

  - product_name: "Cloud SQL"
    implementation: toolbox
    endpoint_type: DEV
    tools_source:
      type: stdio
      command: "npx"
      args: ["-y", "@toolbox-sdk/server", "--prebuilt=cloud-sql-postgres", "--stdio"]
      # env:
      #   CLOUD_SQL_POSTGRES_PROJECT: "your-gcp-project"

  # --- BigQuery: MCP Toolbox (live, needs creds) ---------------------------
  - product_name: "BigQuery"
    implementation: toolbox
    endpoint_type: DEV
    tools_source:
      type: stdio
      # MCP Toolbox for Databases, run over stdio via its npm wrapper.
      command: "npx"
      args: ["-y", "@toolbox-sdk/server", "--prebuilt=bigquery", "--stdio"]
      # Needs BigQuery credentials in the environment (ADC + project), e.g.:
      # env:
      #   BIGQUERY_PROJECT: "your-gcp-project"

  # --- Sample product: two offline implementations (deterministic demo) -----
  # A paired, network-free example so the full comparison path (union
  # completeness + comparison.md) can be exercised without live endpoints.
  - product_name: "Sample DB"
    implementation: one_mcp
    endpoint_type: DEV
    tools_source:
      type: file
      path: datasets/mcp_readability/sample_tools.json

  - product_name: "Sample DB"
    implementation: toolbox
    endpoint_type: DEV
    tools_source:
      type: file
      path: datasets/mcp_readability/sample_tools_toolbox.json
